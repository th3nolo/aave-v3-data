name: Public data operational check

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'check_operational.py'
      - 'src/operational_check.py'
      - '.github/workflows/operational-check.yml'

permissions:
  contents: read

jobs:
  published-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.8.22'
          enable-cache: false
      - name: Install verified runtime closure
        run: |
          uv venv --python python
          uv pip sync --require-hashes --only-binary :all: requirements.lock
          uv pip check
      - name: Check public JSON and bounded live coverage
        run: uv run --no-project --no-sync python check_operational.py --live
      - name: Retain actionable report in job summary
        if: always()
        shell: bash
        run: |
          if [ -f operational_local_report.json ]; then
            printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat operational_local_report.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Operational check did not produce a report; coverage is missing.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
